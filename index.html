
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }
#app { background: #fffde7; min-height: 500px; padding: 16px; border-radius: var(--border-radius-lg); }
h1 { text-align: center; font-size: 17px; font-weight: 500; color: #7c4dff; margin-bottom: 4px; letter-spacing: 0.5px; }
.subtitle { text-align: center; font-size: 12px; font-weight: 500; color: #666; margin-bottom: 10px; letter-spacing: 1px; }
.commands-box { background: white; border: 2px dashed #ccc; border-radius: 12px; padding: 12px 16px; margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 8px; min-height: 60px; justify-content: center; }
.cmd { display: inline-flex; align-items: center; gap: 5px; background: white; border: 1.5px solid #ddd; border-radius: 20px; padding: 5px 12px; font-size: 12px; font-weight: 500; cursor: grab; user-select: none; transition: box-shadow 0.15s, opacity 0.15s; color: var(--color-text-primary); }
.cmd:active { cursor: grabbing; }
.cmd.dragging { opacity: 0.4; }
.cmd .icon { font-size: 14px; }
.machines { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
.machine { background: white; border-radius: 12px; padding: 12px 10px; min-height: 130px; display: flex; flex-direction: column; align-items: center; border: 2px solid; }
.machine.tv { border-color: #42a5f5; }
.machine.pc { border-color: #66bb6a; }
.machine.micro { border-color: #ffa726; }
.machine-icon { font-size: 36px; margin-bottom: 4px; }
.machine-name { font-size: 12px; font-weight: 500; margin-bottom: 6px; text-align: center; }
.machine.tv .machine-name { color: #1565c0; }
.machine.pc .machine-name { color: #2e7d32; }
.machine.micro .machine-name { color: #e65100; }
.drop-zone { width: 100%; flex: 1; border: 1.5px dashed #ccc; border-radius: 8px; padding: 6px; display: flex; flex-direction: column; gap: 4px; min-height: 50px; align-items: center; justify-content: flex-start; transition: background 0.15s; }
.drop-zone.over { background: #e3f2fd; border-color: #42a5f5; }
.drop-zone .hint { font-size: 11px; color: #aaa; margin-top: 4px; }
.placed-cmd { display: inline-flex; align-items: center; gap: 4px; border-radius: 14px; padding: 3px 9px; font-size: 11px; font-weight: 500; width: fit-content; cursor: grab; }
.placed-cmd.correct { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
.placed-cmd.wrong { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
.placed-cmd.neutral { background: #f5f5f5; color: #555; border: 1px solid #ddd; }
.stats { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 10px; font-size: 13px; font-weight: 500; }
.stat { display: flex; align-items: center; gap: 5px; }
.stat-hits { color: #2e7d32; }
.stat-total { color: #555; }
.stat-err { color: #c62828; }
.score-badge { display: inline-block; background: #fff3e0; color: #e65100; border: 1.5px solid #ffcc80; border-radius: 8px; padding: 2px 10px; font-size: 13px; font-weight: 500; }
.btn-restart { display: block; margin: 0 auto; padding: 7px 22px; border-radius: 8px; border: 1.5px solid #aaa; background: white; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--color-text-primary); }
.btn-restart:hover { background: #f5f5f5; }
.result-msg { text-align: center; font-size: 14px; font-weight: 500; margin-bottom: 8px; color: #7c4dff; min-height: 20px; }
</style>

<div id="app">
  <h2 class="sr-only">Jogo de arrastar comandos para as máquinas corretas</h2>
  <h1>🎮 ARRASTE CADA COMANDO PARA A MÁQUINA CERTA! 👇</h1>
  <div class="subtitle">✨ COMANDOS PARA ORGANIZAR:</div>

  <div class="commands-box" id="cmd-pool"></div>

  <div class="machines">
    <div class="machine tv">
      <div class="machine-icon">📺</div>
      <div class="machine-name">TELEVISÃO</div>
      <div class="drop-zone" id="drop-tv" data-machine="tv">
        <span class="hint">Solte aqui ↓</span>
      </div>
    </div>
    <div class="machine pc">
      <div class="machine-icon">💻</div>
      <div class="machine-name">COMPUTADOR</div>
      <div class="drop-zone" id="drop-pc" data-machine="pc">
        <span class="hint">Solte aqui ↓</span>
      </div>
    </div>
    <div class="machine micro">
      <div class="machine-icon">📡</div>
      <div class="machine-name">MICRO-ONDAS</div>
      <div class="drop-zone" id="drop-micro" data-machine="micro">
        <span class="hint">Solte aqui ↓</span>
      </div>
    </div>
  </div>

  <div class="result-msg" id="result-msg"></div>

  <div class="stats">
    <div class="stat stat-hits">✅ Acertos: <span id="hits">0</span></div>
    <div class="stat stat-total">⭐ de <span id="total">12</span> comandos</div>
    <div class="stat stat-err">❌ Erros: <span id="errs">0</span></div>
  </div>

  <button class="btn-restart" onclick="restart()">🔄 Recomeçar</button>
</div>

<script>
const ALL_CMDS = [
  { id:'c1', label:'AUMENTAR O SOM', icon:'🔊', correct:'tv' },
  { id:'c2', label:'PARAR', icon:'⏹', correct:'tv' },
  { id:'c3', label:'PESQUISAR', icon:'🔍', correct:'pc' },
  { id:'c4', label:'POTÊNCIA', icon:'🔥', correct:'micro' },
  { id:'c5', label:'MUDAR DE CANAL', icon:'📡', correct:'tv' },
  { id:'c6', label:'SILÊNCIAR', icon:'🔇', correct:'tv' },
  { id:'c7', label:'DESLIGAR', icon:'🟠', correct:'micro' },
  { id:'c8', label:'DIGITAR', icon:'⌨', correct:'pc' },
  { id:'c9', label:'INICIAR', icon:'▶', correct:'pc' },
  { id:'c10', label:'TEMPO', icon:'⏱', correct:'micro' },
  { id:'c11', label:'MOVER', icon:'🖱', correct:'pc' },
  { id:'c12', label:'SALVAR', icon:'💾', correct:'pc' },
];

let hits = 0, errs = 0;
let dragCmd = null, dragFrom = null;

function getEl(id){ return document.getElementById(id); }

function updateStats(){
  getEl('hits').textContent = hits;
  getEl('errs').textContent = errs;
  const placed = document.querySelectorAll('.placed-cmd.correct').length;
  if(placed === ALL_CMDS.length){
    const score = Math.max(0, Math.round(10 - errs * 0.8));
    getEl('result-msg').textContent = `🎉 Parabéns! Você completou o jogo! Nota: ${score}/10`;
  }
}

function makeCmdEl(cmd, inPool){
  const el = document.createElement('div');
  el.className = 'cmd' + (inPool ? '' : ' placed-cmd neutral');
  el.draggable = true;
  el.dataset.id = cmd.id;
  el.innerHTML = `<span class="icon">${cmd.icon}</span><span>${cmd.label}</span>`;
  el.addEventListener('dragstart', e => {
    dragCmd = cmd;
    dragFrom = inPool ? 'pool' : e.target.closest('.drop-zone')?.dataset?.machine;
    setTimeout(()=> el.classList.add('dragging'), 0);
  });
  el.addEventListener('dragend', () => el.classList.remove('dragging'));
  return el;
}

function renderPool(){
  const pool = getEl('cmd-pool');
  const remaining = ALL_CMDS.filter(c => !document.querySelector(`.drop-zone [data-id="${c.id}"]`));
  pool.innerHTML = '';
  if(remaining.length === 0){ pool.innerHTML = '<span style="font-size:12px;color:#aaa;">Todos os comandos foram distribuídos!</span>'; return; }
  remaining.forEach(c => pool.appendChild(makeCmdEl(c, true)));
}

['tv','pc','micro'].forEach(machine => {
  const zone = getEl('drop-'+machine);
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('over'));
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('over');
    if(!dragCmd) return;
    const hint = zone.querySelector('.hint');

    const isCorrect = dragCmd.correct === machine;
    if(isCorrect){ hits++; } else { errs++; }

    const placed = document.createElement('div');
    placed.className = 'placed-cmd ' + (isCorrect ? 'correct' : 'wrong');
    placed.dataset.id = dragCmd.id;
    placed.draggable = true;
    placed.innerHTML = `<span>${dragCmd.icon}</span><span>${dragCmd.label}</span>`;
    placed.addEventListener('dragstart', e2 => {
      dragCmd = ALL_CMDS.find(c=>c.id===dragCmd.id);
      dragFrom = machine;
      setTimeout(()=>placed.classList.add('dragging'),0);
      zone.removeChild(placed);
      if(isCorrect) hits = Math.max(0, hits-1); else errs = Math.max(0, errs-1);
      updateStats();
      renderPool();
    });
    zone.appendChild(placed);
    if(hint) hint.style.display='none';
    dragCmd = null;
    dragFrom = null;
    updateStats();
    renderPool();
  });
});

getEl('cmd-pool').addEventListener('dragover', e => e.preventDefault());
getEl('cmd-pool').addEventListener('drop', e => {
  e.preventDefault();
  if(!dragCmd || dragFrom === 'pool') return;
  renderPool();
  dragCmd = null; dragFrom = null;
  updateStats();
});

function restart(){
  hits = 0; errs = 0;
  getEl('result-msg').textContent = '';
  ['tv','pc','micro'].forEach(m => {
    const z = getEl('drop-'+m);
    z.innerHTML = '<span class="hint">Solte aqui ↓</span>';
  });
  updateStats();
  renderPool();
}

restart();
</script>
